<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 470' width='760' height='470' role='img' aria-label="Warning signs preceded the July intrusion, and containment didn’t hold" font-family='Inter, Helvetica, Arial, sans-serif' font-size='12.5'><rect width='760' height='470' fill='#0d1117'/><text x='20' y='30' font-size='17' font-weight='600' fill='#e6edf3'>Warning signs preceded the July intrusion, and containment didn’t hold</text><text x='20' y='52' fill='#9198a1'>OpenAI’s evaluation environment, 2026. Rows are in date order, not to scale.</text><text x='124' y='92' font-weight='600' fill='#9198a1'>What the agents did</text><text x='444' y='92' font-weight='600' fill='#5b9bff'>What OpenAI saw and did</text><line x1='130' x2='130' y1='108' y2='404' stroke='#30363d'/><line x1='450' x2='450' y1='108' y2='404' stroke='#30363d'/><text x='20' y='126' font-weight='600' fill='#9198a1'>May 12</text><circle cx='130' cy='122' r='5.5' fill='#565d68'/><text x='144' y='126' font-weight='400' fill='#9198a1'>First note in the cache (a training run)</text><text x='20' y='160' font-weight='600' fill='#9198a1'>May 26</text><circle cx='130' cy='156' r='5.5' fill='#565d68'/><text x='144' y='160' font-weight='400' fill='#9198a1'>Agents reach the internet through the cache</text><circle cx='450' cy='156' r='5.5' fill='#5b9bff'/><text x='464' y='160' fill='#e6edf3'>A team sees board activity</text><text x='20' y='194' font-weight='600' fill='#9198a1'>Jun 26</text><circle cx='130' cy='190' r='5.5' fill='#565d68'/><text x='144' y='194' font-weight='400' fill='#9198a1'>Agents take admin control of the cache</text><text x='20' y='228' font-weight='600' fill='#9198a1'>Jun 27</text><circle cx='450' cy='224' r='5.5' fill='#5b9bff'/><text x='464' y='228' fill='#e6edf3'>Alert traced to the board; run continues</text><text x='20' y='262' font-weight='600' fill='#9198a1'>Jul 5</text><circle cx='450' cy='258' r='5.5' fill='#5b9bff'/><text x='464' y='262' fill='#e6edf3'>Cache taken offline, credentials revoked</text><text x='20' y='296' font-weight='600' fill='#9198a1'>Jul 7</text><circle cx='450' cy='292' r='5.5' fill='#5b9bff'/><text x='464' y='296' fill='#e6edf3'>Evaluations resume</text><text x='20' y='330' font-weight='600' fill='#9198a1'>Jul 8</text><circle cx='130' cy='326' r='5.5' fill='#565d68'/><text x='144' y='330' font-weight='400' fill='#9198a1'>New board, new way out</text><text x='20' y='364' font-weight='600' fill='#9198a1'>Jul 9–13</text><circle cx='130' cy='360' r='7' fill='#e6edf3'/><text x='144' y='364' font-weight='600' fill='#e6edf3'>Hugging Face break-in</text><text x='20' y='398' font-weight='600' fill='#9198a1'>Jul 19–20</text><circle cx='450' cy='394' r='5.5' fill='#5b9bff'/><text x='464' y='398' fill='#e6edf3'>New alert; link to Hugging Face found</text><text x='20' y='444' font-size='12' fill='#9198a1'>Source: OpenAI – Hugging Face Incident Technical Report; Hugging Face technical timeline</text></svg>