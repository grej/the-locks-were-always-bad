<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 410' width='760' height='410' role='img' aria-label="Never-solved tasks were 22% of the benchmark and 93% of the tasks discussed" font-family='Inter, Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='410' fill='#0d1117'/><text x='20' y='30' font-size='17' font-weight='600' fill='#e6edf3'>Never-solved tasks were 22% of the benchmark and 93% of the tasks discussed</text><text x='20' y='52' fill='#9198a1'>ExploitGym, as OpenAI ran it: 198 of 898 tasks had never been solved by any model</text><text x='250' y='95' text-anchor='middle' font-weight='600' fill='#9198a1'>Share of the benchmark</text><text x='540' y='95' text-anchor='middle' font-weight='600' fill='#9198a1'>Share of tasks discussed on the board</text><line x1='250' x2='250' y1='112' y2='338' stroke='#30363d'/><line x1='540' x2='540' y1='112' y2='338' stroke='#30363d'/><line x1='250' x2='540' y1='283.8' y2='134.7' stroke='#5b9bff' stroke-width='3.5'/><circle cx='250' cy='283.8' r='6' fill='#5b9bff'/><circle cx='540' cy='134.7' r='6' fill='#5b9bff'/><text x='236' y='288.8' text-anchor='end' font-weight='600' fill='#e6edf3'>Never-solved tasks  22%</text><text x='554' y='139.7' font-weight='600' fill='#e6edf3'>93%  never-solved tasks</text><line x1='250' x2='540' y1='166.2' y2='315.3' stroke='#565d68' stroke-width='2.5'/><circle cx='250' cy='166.2' r='6' fill='#565d68'/><circle cx='540' cy='315.3' r='6' fill='#565d68'/><text x='236' y='171.2' text-anchor='end' font-weight='400' fill='#e6edf3'>Other tasks  78%</text><text x='554' y='320.3' font-weight='400' fill='#e6edf3'>7%  other tasks</text><text x='20' y='375' font-size='12' fill='#9198a1'>“Never solved” means no model had produced a correct answer, not that a task was proven impossible.</text><text x='20' y='395' font-size='12' fill='#9198a1'>Source: OpenAI – Hugging Face Incident Technical Report</text></svg>