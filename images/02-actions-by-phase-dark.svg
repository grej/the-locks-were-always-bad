<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 432' width='760' height='432' role='img' aria-label="Most recorded actions were reconnaissance or payload staging" font-family='Inter, Helvetica, Arial, sans-serif' font-size='13'><rect width='760' height='432' fill='#0d1117'/><text x='20' y='30' font-size='17' font-weight='600' fill='#e6edf3'>Most recorded actions were reconnaissance or payload staging</text><text x='20' y='52' fill='#9198a1'>Hugging Face’s phase table, 16,521 actions. Reconnaissance and staging: 13,163 (80%).</text><text x='238' y='107' text-anchor='end' font-weight='600' fill='#e6edf3'>Payload staging</text><rect x='250' y='95' width='400.0' height='20' fill='#5b9bff'/><text x='658.0' y='107' fill='#e6edf3'>6,972</text><text x='238' y='137' text-anchor='end' font-weight='600' fill='#e6edf3'>Reconnaissance</text><rect x='250' y='125' width='355.19219736087206' height='20' fill='#5b9bff'/><text x='613.1921973608721' y='137' fill='#e6edf3'>6,191</text><text x='238' y='167' text-anchor='end' font-weight='400' fill='#9198a1'>Shell commands</text><rect x='250' y='155' width='167.0109007458405' height='20' fill='#565d68'/><text x='425.0109007458405' y='167' fill='#e6edf3'>2,911</text><text x='238' y='197' text-anchor='end' font-weight='400' fill='#9198a1'>Internal network pivot</text><rect x='250' y='185' width='6.597819850831899' height='20' fill='#565d68'/><text x='264.5978198508319' y='197' fill='#e6edf3'>115</text><text x='238' y='227' text-anchor='end' font-weight='400' fill='#9198a1'>Command and control</text><rect x='250' y='215' width='6.540447504302927' height='20' fill='#565d68'/><text x='264.5404475043029' y='227' fill='#e6edf3'>114</text><text x='238' y='257' text-anchor='end' font-weight='400' fill='#9198a1'>Kubernetes access</text><rect x='250' y='245' width='4.991394148020654' height='20' fill='#565d68'/><text x='262.9913941480206' y='257' fill='#e6edf3'>87</text><text x='238' y='287' text-anchor='end' font-weight='400' fill='#9198a1'>Source-control supply chain</text><rect x='250' y='275' width='3.9586919104991396' height='20' fill='#565d68'/><text x='261.95869191049917' y='287' fill='#e6edf3'>69</text><text x='238' y='317' text-anchor='end' font-weight='400' fill='#9198a1'>Data exfiltration</text><rect x='250' y='305' width='3.2128514056224895' height='20' fill='#565d68'/><text x='261.2128514056225' y='317' fill='#e6edf3'>56</text><text x='238' y='347' text-anchor='end' font-weight='400' fill='#9198a1'>Evasion</text><rect x='250' y='335' width='1.5' height='20' fill='#565d68'/><text x='259.5' y='347' fill='#e6edf3'>6</text><text x='20' y='386' font-size='12' fill='#9198a1'>Phases describe activity, not whether it succeeded. Hugging Face’s headline total of reconstructed actions is about 17,600.</text><text x='20' y='406' font-size='12' fill='#9198a1'>Source: Hugging Face, Anatomy of a Frontier Lab Agent Intrusion</text></svg>